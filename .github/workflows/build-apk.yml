name: Build WASEEM MEDICAL APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Flutter project
        shell: bash
        run: |
          set -e

          mkdir -p /tmp/waseem_medical

          unzip -q WASEEM_MEDICAL_PRO_FINAL.zip \
            -d /tmp/waseem_medical

          PROJECT_DIR=$(find /tmp/waseem_medical \
            -name pubspec.yaml \
            -type f \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: pubspec.yaml not found."
            find /tmp/waseem_medical -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Flutter project found at:"
          echo "$PROJECT_DIR"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Analyze project
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Collect APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          APK=$(find "$PROJECT_DIR/build/app/outputs/flutter-apk" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          cp "$APK" release/WASEEM-MEDICAL-release.apk

          ls -lh release/WASEEM-MEDICAL-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WASEEM-MEDICAL-APK
          path: release/WASEEM-MEDICAL-release.apk
          if-no-files-found: error
